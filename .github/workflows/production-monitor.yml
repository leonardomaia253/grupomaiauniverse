name: Production monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      target_url:
        description: Staging or production base URL
        required: true
        default: https://universe.grupomaia.me

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_BASE_URL: ${{ inputs.target_url || 'https://universe.grupomaia.me' }}
      HEALTHCHECK_TOKEN: ${{ secrets.HEALTHCHECK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run test:smoke
